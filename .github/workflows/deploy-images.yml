name: Resize images and deploy to Bunny

on:
  push:
    branches: [main]
    paths:
      - src/img/originals/**

permissions:
  contents: write

concurrency:
  group: bunny-production
  cancel-in-progress: false

jobs:
  resize-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate resized images
        run: npm run images -- --force

      - name: Commit resized images
        run: |
          git add src/img/resized
          if git diff --cached --quiet; then
            echo "No resized image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate resized images"
          git push

      - name: Build website
        run: npm run build

      - name: Deploy to Bunny
        run: npm run deploy:upload -- --interactive
        env:
          BUNNY_STORAGE_ZONE_NAME: ${{ vars.BUNNY_STORAGE_ZONE_NAME }}
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          BUNNY_STORAGE_REGION: ${{ vars.BUNNY_STORAGE_REGION }}
          BUNNY_STORAGE_PATH: ${{ vars.BUNNY_STORAGE_PATH }}
          BUNNY_CDN_HOSTNAME: ${{ vars.BUNNY_CDN_HOSTNAME }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
