name: Test content-only deploy to Bunny

on:
  push:
    branches: [dev]
    paths:
      - .eleventy.js
      - package.json
      - package-lock.json
      - src/metadata/**
      - src/_data/**
      - src/about.md
      - .github/workflows/deploy-content-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bunny-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTENT_ONLY: "true"
      CONTENT_PRESERVE_PATHS: img/**
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          sparse-checkout: |
            /*
            !/src/img/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website without image sources
        run: npm run build

      - name: Deploy to test Bunny zone
        run: npm run deploy:upload -- --interactive
        env:
          BUNNY_STORAGE_ZONE_NAME: ${{ vars.TEST_BUNNY_STORAGE_ZONE_NAME }}
          BUNNY_ACCESS_KEY: ${{ secrets.TEST_BUNNY_ACCESS_KEY }}
          BUNNY_STORAGE_REGION: ${{ vars.TEST_BUNNY_STORAGE_REGION }}
          BUNNY_STORAGE_PATH: ${{ vars.TEST_BUNNY_STORAGE_PATH }}
          BUNNY_CDN_HOSTNAME: ${{ vars.TEST_BUNNY_CDN_HOSTNAME }}
          BUNNY_API_KEY: ${{ secrets.TEST_BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ vars.TEST_BUNNY_PULL_ZONE_ID }}
